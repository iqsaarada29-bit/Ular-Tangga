#bw{position:relative;margin-bottom:11%}
#bd{display:grid;grid-template-columns:repeat(10,1fr);aspect-ratio:1;border-radius:14px;overflow:hidden;border:5px solid;box-shadow:0 6px 18px #0003}

.cell .n{position:absolute;top:2px;left:3px;font-size:clamp(7px,2.2vw,11px);color:#3a2a1a;font-weight:800;opacity:.75}

@keyframes hop{50%{margin-top:-5px}}@keyframes climb{0%,100%{transform:translate(-50%,-50%) rotate(-14deg) scale(1.2)}50%{transform:translate(-50%,-62%) rotate(14deg) scale(1.2)}}

@keyframes fxp{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}25%{opacity:1;transform:translate(-50%,-70%) scale(1.3)}100%{opacity:0;transform:translate(-50%,-140%) scale(1)}}
#start{position:absolute;left:0;right:0;bottom:-10.5%;font-size:12px;color:var(--mut);font-weight:800;letter-spacing:2px;padding-left:2%}

<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LAD={2:38,7:14,8:31,15:26,21:42,28:84,36:44,51:67,71:91,78:98,87:94};
const SNK={16:6,46:25,49:11,62:19,64:60,74:53,89:68,92:88,95:75,99:80};
const JUMP={...LAD,...SNK};
const COLS=['#e63946','#ff9f1c','#2ec4b6','#3a86ff','#8338ec','#ff5da2','#06d6a0','#374151'];
const EMOS=['🦊','🐸','🐥','🦄','🐼','🐙','🦁','🚀'];
const THEMES=[{n:'🍭 Permen',c:['#ffb3d9','#a8e6ff','#fff09a','#b9f5b0'],b:'#ff4fa3'},{n:'🌴 Hutan',c:['#a8ecaa','#7fd884','#ffe58a','#c2f0cf'],b:'#2e7d32'},{n:'🌊 Samudra',c:['#8fd8ff','#5cc0f5','#b8f5ff','#8ff5df'],b:'#0277bd'},{n:'🌌 Galaksi',c:['#c3b2ff','#ffa8e8','#a0c4ff','#ffc78f'],b:'#5e35b1'}];
const SC=['#2e9e4f','#e0245e','#1c7ed6','#f76707','#7048e8','#0ca678','#d6336c','#f59f00','#5c940d','#3b5bdb'];
const F='⚀⚁⚂⚃⚄⚅',BOTS=['Robo','Bola','Kiko'];
let fb=null,G='sl',VOTES={},gs=2,gb=3,me={id:null,name:'',ci:0,ei:0,th:0},mode=null,room=null,R=null,S=null,view='home',members=[],disp=[],animSeq=0,inited=false,busy=false,botT=null,hs=2,mute=false,ac=null,wr=false,mv=0,walked=false;
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2800+t.length*45)}
function beep(f,d){if(mute)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const ctr=n=>{const r=Math.floor((n-1)/10),k=(n-1)%10,c=r%2?9-k:k;return[c*10+5,(9-r)*10+5]};
const xy=n=>n?ctr(n):[12,105.5];
function sg(a,b){const[x1,y1]=ctr(a),[x2,y2]=ctr(b),dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),nx=-dy/L,ny=dx/L,g=[];let px=x1,py=y1;
 for(let i=1;i<=5;i++){const s=i%2?1:-1,m=(i-.5)/5,t=i/5,ex=x1+dx*t,ey=y1+dy*t;g.push([px,py,x1+dx*m+nx*4*s,y1+dy*m+ny*4*s,ex,ey]);px=ex;py=ey}return g}
function snake(a,b,col){const g=sg(a,b);let d=`M${g[0][0]} ${g[0][1]}`;g.forEach(s=>d+=`Q${s[2].toFixed(1)} ${s[3].toFixed(1)} ${s[4].toFixed(1)} ${s[5].toFixed(1)}`);const[x,y]=ctr(a);
 return`<path d="${d}" fill="none" stroke="#0007" stroke-width="3.3" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width=".7" stroke-dasharray="1 1.6" stroke-linecap="round"/><circle cx="${x}" cy="${y}" r="2.7" fill="${col}" stroke="#0007" stroke-width=".5"/><circle cx="${x-.9}" cy="${y-.7}" r=".7" fill="#fff"/><circle cx="${x+.9}" cy="${y-.7}" r=".7" fill="#fff"/><circle cx="${x-.9}" cy="${y-.7}" r=".3" fill="#000"/><circle cx="${x+.9}" cy="${y-.7}" r=".3" fill="#000"/><path d="M${x} ${y+1.6}l0 1.6M${x} ${y+3.2}l-.6 .7M${x} ${y+3.2}l.6 .7" stroke="#e03" stroke-width=".35" fill="none"/>`}
function ladder(a,b){const[x1,y1]=ctr(a),[x2,y2]=ctr(b),dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),nx=-dy/L*1.5,ny=dx/L*1.5,m=Math.max(2,Math.round(L/4.2));
 const rail=(w,c)=>`<g stroke="${c}" stroke-linecap="round"><line x1="${x1+nx}" y1="${y1+ny}" x2="${x2+nx}" y2="${y2+ny}" stroke-width="${w}"/><line x1="${x1-nx}" y1="${y1-ny}" x2="${x2-nx}" y2="${y2-ny}" stroke-width="${w}"/>`;
 let s=rail(1.7,'#5a3a14')+'</g>'+rail(1,'#e0a34a');for(let i=1;i<m;i++){const t=i/m,px=x1+dx*t,py=y1+dy*t;s+=`<line x1="${px+nx}" y1="${py+ny}" x2="${px-nx}" y2="${py-ny}" stroke-width=".8" stroke="#ffd37a"/>`}return s+'</g>'}
function newGame(ps,ex){return{...(ex||{}),status:'play',phase:'roll',turn:0,players:ps.map(p=>({id:p.id,name:p.name,bot:!!p.bot,pos:0,col:p.col||COLS[p.ci],emo:p.emo||EMOS[p.ei]})),seq:0,last:null,roll:null,winner:null,msg:'Giliran '+ps[0].name+' mulai! Lempar dadunya.'}}
function uniq(ps){const uc=new Set(),ue=new Set();ps.forEach(p=>{while(uc.has(p.ci))p.ci=(p.ci+1)%8;while(ue.has(p.ei))p.ei=(p.ei+1)%8;uc.add(p.ci);ue.add(p.ei)});return ps}
/* ---------- HOME ---------- */
function getName(){const v=($('#nm')&&$('#nm').value.trim())||me.name||'Pemain';me.name=v.slice(0,12);ls.set('ut_name',me.name);return me.name}
function renderHome(){view='home';G='sl';document.body.dataset.g='sl';app.innerHTML=`<div class="card rise"><button class="btn alt" data-a="hub" style="padding:6px 12px;min-height:0">← Semua game</button><h1>🐍 Ular Tangga 🪜</h1><p class="mut" style="text-align:center;margin:4px 0 0">Lempar dadu, jalankan pionmu sendiri, jangan sampai salah kotak!</p>
<label>Namamu</label><input id="nm" maxlength="12" placeholder="Nama" value="${esc(me.name)}">
<label>Warna pion</label><div class="sw">${COLS.map((c,i)=>`<button class="sq ${me.ci==i?'sel':''}" data-c="${i}" style="background:${c}"></button>`).join('')}</div>
<label>Karakter pion</label><div class="sw">${EMOS.map((e,i)=>`<button class="sq ${me.ei==i?'sel':''}" data-e="${i}">${e}</button>`).join('')}</div>
<label>Tema papan (host yang menentukan)</label><div class="sw">${THEMES.map((t,i)=>`<button class="th ${me.th==i?'sel':''}" data-th="${i}" style="background:linear-gradient(90deg,${t.c.slice(0,3).join(',')})">${t.n}</button>`).join('')}</div>
<h3>👥 Satu HP bergantian (tanpa online)</h3><div class="row"><button class="btn" data-h="2">2 Pemain</button><button class="btn" data-h="3">3 Pemain</button><button class="btn" data-h="4">4 Pemain</button></div>
<h3>🤖 Lawan AI</h3><div class="row"><button class="btn" data-l="2">2 Pemain</button><button class="btn" data-l="4">4 Pemain</button></div>
<h3>👫 Main bareng teman (online)</h3>${fb?`<div class="row"><button class="btn alt ${hs==2?'on':''}" data-s="2">2 Pemain</button><button class="btn alt ${hs==4?'on':''}" data-s="4">4 Pemain</button></div>
<button class="btn" data-a="mk" style="width:100%;margin-top:8px">Buat room</button>
<div class="row" style="margin-top:10px"><input id="cd" maxlength="5" placeholder="KODE" style="text-transform:uppercase"><button class="btn alt" data-a="jn">Gabung</button></div><p class="mut">Jangan sebar kode room ke orang asing. Kalau halaman tertutup, buka lagi link ini untuk kembali ke room.</p>`:`<p class="mut">Mode online sedang menyambung ke Firebase. Kalau tidak kunjung muncul, pastikan HP tersambung internet lalu muat ulang halaman.</p>`}</div>`}
const pick=(t,k,v)=>{me[k]=v;ls.set('ut_'+k,v);t.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('sel',b===t))};
app.onclick=async e=>{const tk=e.target.closest('[data-k]');if(tk&&G==='ludo'){ludoTap(tk.dataset.k);return}const t=e.target.closest('button');if(!t)return;const d=t.dataset;if(gClick(t,d))return;
 if(d.c!==undefined)pick(t,'ci',+d.c);else if(d.e!==undefined)pick(t,'ei',+d.e);else if(d.th!==undefined)pick(t,'th',+d.th);
 else if(d.l){getName();startLocal(+d.l)}
 else if(d.h){getName();startLocal(+d.h,true)}
 else if(d.s){hs=+d.s;document.querySelectorAll('[data-s]').forEach(b=>b.classList.toggle('on',b.dataset.s==hs))}
 else if(d.a==='mk'){getName();createRoom(hs)}
 else if(d.a==='jn'){getName();joinRoom(($('#cd').value||'').trim().toUpperCase())}
 else if(d.a==='go')startOnline()
 else if(d.a==='copy'){try{await navigator.clipboard.writeText(room);toast('Kode disalin')}catch(x){toast('Kode: '+room)}}
 else if(d.a==='quit')leave()
 else if(d.a==='roll')canRoll()&&doRoll()
 else if(d.a==='snd'){mute=!mute;t.textContent=mute?'🔇':'🔊'}
 else if(d.a==='skip'&&S&&S.host===me.id)commit({...S,turn:(S.turn+1)%S.players.length,phase:'roll',seq:S.seq+1,last:null,msg:'Giliran dilewati host'})
 else if(d.a==='again'){if(mode==='local')startLocal(S.players.length,S.hot);else if(S.host===me.id)commit(newGame(S.players,{size:S.size,host:S.host,created:S.created,theme:S.theme}))}};
/* ---------- LOCAL ---------- */
function startLocal(n,hot){mode='local';room=null;const ps=[{id:me.id,name:me.name,ci:me.ci,ei:me.ei}];for(let i=1;i<n;i++)ps.push(hot?{id:'h'+i,name:'Pemain '+(i+1),ci:0,ei:0}:{id:'bot'+(i-1),name:BOTS[i-1],bot:true,ci:0,ei:0});S=newGame(uniq(ps),{size:n,theme:me.th,hot:!!hot});showGame()}
/* ---------- ONLINE (Firebase Realtime Database) ---------- */
const FBCFG={apiKey:"AIzaSyCy4x4Y89mM5uYGmOzMeGQv62gcPDgn4rA",authDomain:"ular-tangga-11294.firebaseapp.com",databaseURL:"https://ular-tangga-11294-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"ular-tangga-11294",storageBucket:"ular-tangga-11294.firebasestorage.app",messagingSenderId:"407801158923",appId:"1:407801158923:web:246f84f084d635870dd60e"};
let offFn=null;
async function initFb(){try{const u='https://www.gstatic.com/firebasejs/13.0.0/',[a,d]=await Promise.all([import(u+'firebase-app.js'),import(u+'firebase-database.js')]);fb={...d,db:d.getDatabase(a.initializeApp(FBCFG))}}catch(e){fb=null}}
const rp=(c,p)=>fb.ref(fb.db,'rooms/'+c+(p?'/'+p:''));
const mine=()=>({name:me.name,t:Date.now(),ci:me.ci,ei:me.ei});
function applyState(st){S=st;R=st;G=st.game||'sl';document.body.dataset.g=G;if(G!=='sl'){GM[G].render();return}if(!$('#bw'))showGame();else onState()}
async function createRoom(size){const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let c='';
 try{for(let k=0;k<5;k++){c='';for(let i=0;i<5;i++)c+=A[Math.floor(Math.random()*A.length)];if(!(await fb.get(rp(c))).exists())break;c=''}
  if(!c)return toast('Coba lagi sebentar');
  await fb.set(rp(c,'lobby'),JSON.stringify({status:'lobby',size,host:me.id,created:Date.now(),theme:me.th,game:G,bs:gb}));await fb.set(rp(c,'members/'+me.id),mine());enterRoom(c)}
 catch(e){toast('Gagal membuat room. Cek internet dan aturan database Firebase.')}}
async function joinRoom(c,quiet){c=(c||'').toUpperCase().trim();const tt=t=>quiet?ls.set('ut_room',null):toast(t);if(c.length<4)return tt('Masukkan kode room');
 try{const g=await fb.get(rp(c));if(!g.exists())return tt('Room tidak ditemukan');const d=g.val(),ms=d.members||{};
  if(d.state){if(!JSON.parse(d.state).players.some(p=>p.id===me.id))return tt('Game sudah dimulai')}
  else if(!ms[me.id]){if(Object.keys(ms).length>=JSON.parse(d.lobby).size)return tt('Room penuh');await fb.set(rp(c,'members/'+me.id),mine())}
  enterRoom(c)}catch(e){tt('Gagal bergabung. Cek internet dan aturan database Firebase.')}}
function enterRoom(c){mode='online';room=c;ls.set('ut_room',c);S=null;R=null;members=[];if(offFn)offFn();
 offFn=fb.onValue(rp(c),snap=>{if(!snap.exists()){toast('Room ditutup');return leave(true)}const d=snap.val();
  members=Object.entries(d.members||{}).map(([id,v])=>({id,...v})).sort((a,b)=>a.t-b.t);
  try{R=JSON.parse(d.lobby)}catch(e){}VOTES=d.votes||{};if(R&&R.game)G=R.game;
  if(d.state){let st;try{st=JSON.parse(d.state)}catch(e){return}applyState(st)}else{view='lobby';renderLobby()}},()=>toast('Koneksi database bermasalah'))}
function renderLobby(){if(!R)return;view='lobby';const host=R.host===me.id;let sl='';
 for(let i=0;i<R.size;i++){const m=members[i];sl+=`<div class="slot">${m?EMOS[m.ei||0]+' '+esc(m.name)+(m.id===me.id?' (kamu)':''):'<span class="mut">menunggu pemain…</span>'}</div>`}
 app.innerHTML=`<div class="card" style="text-align:center"><h2>${GI[R.game||'sl']||''} · Kode room</h2><div class="code">${esc(room)}</div><p class="mut">Suruh temanmu buka link game ini, lalu Gabung pakai kode ini. Tema: ${THEMES[R.theme||0].n}</p>
<button class="btn alt" data-a="copy">📋 Salin kode</button><div style="text-align:left;margin:14px 0">${sl}</div>
${host?`<button class="btn" data-a="go" style="width:100%">Mulai${(GM[R.game||'sl']||{}).noai?' ('+members.length+' pemain)':members.length<R.size?' (slot kosong diisi AI)':''}</button>`:'<p class="mut">Menunggu host memulai…</p>'}
<button class="btn alt" data-a="quit" style="width:100%;margin-top:8px">Keluar</button></div>`}
function startOnline(){const g=R.game||'sl',M=GM[g]||{},ps=members.slice(0,R.size).map(m=>({id:m.id,name:m.name,ci:m.ci||0,ei:m.ei||0}));
 if(M.min&&ps.length<M.min)return toast('Minimal '+M.min+' pemain');let i=0;if(!M.noai)while(ps.length<R.size)ps.push({id:'bot'+i,name:BOTS[i++],bot:true,ci:0,ei:0});
 const ex={size:ps.length,host:R.host,created:R.created,theme:R.theme||0,game:g,bs:R.bs||3};commit(g==='sl'?newGame(uniq(ps),ex):GM[g].init(mkP(ps),ex))}
function leave(silent){const c=room,inGame=!!S,host=R&&R.host===me.id;if(offFn){try{offFn()}catch(e){}offFn=null}
 if(!silent&&fb&&c&&!inGame){try{host?fb.remove(rp(c)):fb.remove(rp(c,'members/'+me.id))}catch(e){}}
 clearTimeout(botT);snakeStop();ls.set('ut_room',null);mode=null;room=null;S=R=null;busy=false;members=[];renderHub()}
async function commit(ns){if(mode==='local'){S=ns;G==='sl'?onState():GM[G].render();return}
 try{await fb.set(rp(room,'state'),JSON.stringify(ns))}catch(e){toast('Gagal mengirim langkah');walked=false}}
async function rejoin(c){try{const g=await fb.get(rp(c));if(!g.exists())return ls.set('ut_room',null);const d=g.val();let ok=!!(d.members&&d.members[me.id]);
 if(!ok&&d.state)ok=JSON.parse(d.state).players.some(p=>p.id===me.id);if(ok)enterRoom(c);else ls.set('ut_room',null)}catch(e){}}
/* ---------- GAME ---------- */
function showGame(){view='game';inited=false;animSeq=0;busy=false;disp=[];mv=0;walked=false;const th=THEMES[S.theme||0];
 let b='';for(let r=9;r>=0;r--)for(let c=0;c<10;c++){const n=r*10+(r%2?9-c:c)+1;b+=`<div class="cell" data-n="${n}" style="background:${th.c[(r*2+c)%4]}"><span class="n">${n===100?'🏁':n}</span></div>`}
 let svg='',i=0;for(const a in LAD)svg+=ladder(+a,LAD[a]);for(const a in SNK)svg+=snake(+a,SNK[a],SC[i++%SC.length]);
 app.innerHTML=`<div class="top"><b>🐍 Ular Tangga${room?' · '+esc(room):''}</b><span><button class="btn alt" data-a="snd">${mute?'🔇':'🔊'}</button> <button class="btn alt" data-a="quit">Keluar</button></span></div><div id="chips"></div>
<div id="bw"><div id="bd" style="border-color:${th.b}">${b}</div><svg id="ov" viewBox="0 0 100 100">${svg}</svg><div id="toks"></div><div id="start">▶ START</div></div>
<div id="panel"><div id="dice">⚀</div><button class="btn" id="rollb" data-a="roll">🎲 Lempar dadu</button></div><div id="msg"></div><div style="text-align:center"><button class="btn alt" data-a="skip" id="skip" hidden style="font-size:13px;min-height:0;padding:6px 10px">Lewati giliran</button></div><div id="ovl" hidden></div>`;
 $('#toks').innerHTML=S.players.map((p,i)=>`<div class="tok" id="t${i}" style="background:${p.col}">${p.emo}</div>`).join('');
 $('#bd').onclick=e=>{const c=e.target.closest('.cell');if(c)tap(+c.dataset.n)};onState()}
function moveToks(){const cnt={};S.players.forEach((p,i)=>{const n=disp[i]||0,k=cnt[n]=(cnt[n]||0)+1,e=$('#t'+i);if(!e)return;let[x,y]=xy(n);
 const o=[[-1.9,-1.9],[1.9,-1.9],[-1.9,1.9],[1.9,1.9]][k-1];if(n){x+=o[0];y+=o[1]}else x+=i*9;e.style.left=x+'%';e.style.top=y+'%'})}
function snap(){disp=S.players.map(p=>p.pos);moveToks()}
const myTurn=()=>S&&S.status==='play'&&(S.players[S.turn].id===me.id||mode==='local')&&!S.players[S.turn].bot&&!busy;
const canRoll=()=>myTurn()&&S.phase==='roll',canMove=()=>myTurn()&&S.phase==='move';
function fx(t,n){const[x,y]=xy(n),e=document.createElement('div');e.className='fx';e.textContent=t;e.style.left=x+'%';e.style.top=y+'%';$('#bw').appendChild(e);setTimeout(()=>e.remove(),1300)}
function doRoll(){const p=S.players[S.turn],r=1+Math.floor(Math.random()*6),over=p.pos+r>100;
 commit({...S,phase:over?'roll':'move',turn:over?(S.turn+1)%S.players.length:S.turn,roll:r,seq:S.seq+1,last:{k:'roll',i:S.turn,r},
  msg:over?p.name+' dapat '+r+' tapi harus pas di 100. Giliran dilewati.':p.name+' dapat '+r+'. Tap kotak satu per satu sebanyak '+r+' langkah!'})}
function tap(n){if(!canMove())return;const i=S.turn,cur=S.players[i].pos+mv;if(n===cur)return;
 if(n===cur+1){mv++;disp[i]=n;moveToks();beep(520+n*4,.07);if(mv===S.roll)finish(i,n,true);else updateUI()}
 else penalty(i,cur)}
function finish(i,land,manual){const n=S.players.length,p=S.players[i],to=JUMP[land]||land,win=to===100,extra=S.roll===6&&!win,ps=S.players.map(q=>({...q})),bump=[];ps[i].pos=to;
 if(!win)ps.forEach((q,j)=>{if(j!==i&&q.pos===to){const t=Math.max(0,q.pos-3);bump.push({i:j,from:q.pos,to:t});q.pos=t}});
 let msg=p.name+' sampai di '+land+'.';if(LAD[land])msg=p.name+' menemukan tangga! 🪜 Naik ke '+to+'!';else if(SNK[land])msg=p.name+' dimakan ular! 🐍 Turun ke '+to+'.';
 if(bump.length)msg+=' Menendang '+bump.map(b=>ps[b.i].name).join(', ')+' mundur 3!';if(extra)msg+=' Dadu 6, main lagi!';if(win)msg=p.name+' sampai di 100! 🏆';
 walked=manual;mv=0;commit({...S,players:ps,phase:'roll',seq:S.seq+1,last:{k:'step',i,id:p.id,from:p.pos,mid:land,to,bump},turn:win||extra?i:(i+1)%n,status:win?'done':'play',winner:win?i:null,msg})}
function penalty(i,shown){const p=S.players[i],to=Math.max(0,p.pos-1);mv=0;walked=false;
 commit({...S,players:S.players.map((q,j)=>j===i?{...q,pos:to}:q),phase:'roll',turn:(i+1)%S.players.length,seq:S.seq+1,last:{k:'pen',i,from:shown,to},msg:p.name+' salah menaruh posisi! Hukuman mundur 1 kotak ⬇️'})}
function botMove(){const i=S.turn,p=S.players[i];Math.random()<.85?finish(i,p.pos+S.roll,false):penalty(i,p.pos)}
function onState(){if(!$('#bw')||!S)return;
 if(!inited||S.seq<animSeq){snap();inited=true;animSeq=S.seq;mv=0;if(S.roll)$('#dice').textContent=F[S.roll-1]}
 else if(S.seq>animSeq&&!busy){const L=S.last;animSeq=S.seq;
  if(L){const sw=L.k==='step'&&walked&&(L.id===me.id||mode==='local');walked=false;mv=0;
   disp=S.players.map((p,j)=>{if(j===L.i)return sw?L.mid:L.k==='roll'?p.pos:L.from;const b=(L.bump||[]).find(x=>x.i===j);return b?b.from:p.pos});
   moveToks();return animate(L,sw)}snap()}

  h+='</div>';
  if(S.elim&&ph!=='over'&&ucEl!==S.log.length){beep(160,.4);h+=`<div id="ovl"><div class="card" style="text-align:center"><div style="font-size:64px" class="bounce">💀</div><h2>${esc(S.elim.n)} tersingkir!</h2><p>Perannya: <b>${S.elim.r}</b></p><button class="btn" data-x="ok" style="width:100%">Lanjut</button></div></div>`}
  app.innerHTML=h}};
/* ---- WORM ARENA (solo / online, ada bot) ---- */
let SN=null;
function snakeStop(){if(SN){cancelAnimationFrame(SN.raf);clearInterval(SN.iv);clearInterval(SN.ii);SN.off=1;(SN.offs||[]).forEach(f=>{try{f()}catch(e){}});if(SN.host&&SN.room&&fb)try{fb.remove(rp(SN.room+'-s'))}catch(e){}SN=null}}
const SNAMES=['Naga','Kobra','Piton','Sanca','Belut','Viper','Mamba','Boa','Anakonda','Taipan'],SCOL=['#ff595e','#ffca3a','#8ac926','#1982c4','#6a4c93','#ff924c','#52b788','#f15bb5'],SW=2400,NF=450;

GM.snake={min:1,noai:1,init(ps,ex){return{...ex,game:'snake',gid:Date.now(),players:ps,seed:Date.now()%99991,status:'play',turn:0}},
 render(){if(SN&&SN.gid===S.gid)return;GM.snake.run(S)},
 start(){mode='local';room=null;S=null;view='game';GM.snake.run(null)},
 run(st){snakeStop();const on=!!st,isH=!on||st.host===me.id,seed=st?st.seed:Date.now()%99991,rm=on?room:null;
  app.innerHTML=`<div class="top"><b>🪱 Worm Arena${on?' · '+esc(rm):''}</b><button class="btn alt" data-a="quit">Keluar</button></div><div id="sw"><canvas id="cv"></canvas><div id="lb2"></div><button id="bst">⚡</button><div id="go" hidden></div></div>`;
  const cv=$('#cv'),cx=cv.getContext('2d'),sn=SN={off:0,raf:0,iv:0,ii:0,gid:st?st.gid:0,host:isH&&on,room:rm,offs:[]};
  let ws=[],drops=[],pt=[],cam={x:1200,y:1200,z:1},ang=0,boost=0,acc=0,last=performance.now(),fr=0,rsp=0,INP={},rs={},lastSnap=Date.now(),myDead=0,lf=0,lost=0;const gw={};
  const fc=new Array(NF).fill(0),fx=[],fy=[],R=(a,b)=>a+Math.random()*(b-a);

  const mk=(id,name,col,bot)=>{const x=R(300,SW-300),y=R(300,SW-300),a=R(0,6.28),segs=[];for(let i=0;i<36;i++)segs.push({x:x-Math.cos(a)*i*2,y:y-Math.sin(a)*i*2});return{id,name,col,bot,x,y,a,len:12,segs,ta:a,alive:1,tf:null,rt:0,bo:0,boost:0}};
  const meW=()=>ws.find(w=>w.id===me.id);
  const showGo=(txt)=>{const g=$('#go'),w=meW(),sc=w?w.len*10|0:0;g.hidden=false;g.innerHTML=txt?`<div class="card"><div style="font-size:48px">📡</div><h2>${txt}</h2><button class="btn alt" data-a="quit" style="width:100%">Keluar</button></div>`:`<div class="card"><div style="font-size:52px">💀</div><h2>Kamu kalah!</h2><p>Skor: <b>${sc}</b></p><button class="btn" data-x="snk" style="width:100%">Main lagi</button><button class="btn alt" data-a="quit" style="width:100%;margin-top:8px">Keluar</button></div>`};
  sn.rs=()=>{rsp++;if(isH){const w=meW();if(w&&!w.alive)Object.assign(w,mk(w.id,w.name,w.col,0));$('#go').hidden=true;myDead=0}};
  const ad=(a,b)=>{let d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d};
  const die=w=>{w.alive=0;w.segs.forEach((s,i)=>{if(i%5===0)burst(s.x,s.y,w.col,3)});for(let i=0;i<w.segs.length;i+=4)drops.push({x:w.segs[i].x+R(-6,6),y:w.segs[i].y+R(-6,6),v:1.5,c:w.col});if(drops.length>120)drops.splice(0,drops.length-120);w.rt=w.bot?220:0;if(w.id===me.id){myDead=1;showGo()}};
  if(isH){const hs=on?st.players:[{id:me.id,name:me.name||'Kamu',col:COLS[me.ci]}];hs.forEach(p=>ws.push(mk(p.id,p.name,p.col,0)));for(let i=0;i<(on?6:9);i++)ws.push(mk('bot'+i,SNAMES[i],SCOL[i%8],1));const w0=meW();if(w0){cam.x=w0.x;cam.y=w0.y}}
  const tick=()=>{ws.forEach(w=>{
   if(!w.alive){if(w.bot){if(--w.rt<=0)Object.assign(w,mk(w.id,w.name,w.col,1))}else if(INP[w.id]&&(INP[w.id].r||0)>(rs[w.id]||0)){rs[w.id]=INP[w.id].r;Object.assign(w,mk(w.id,w.name,w.col,0))}return}
   if(w.bot){if(fr%6===0){let bd=90000;w.tf=null;for(let i=0;i<NF;i++){const d=(fx[i]-w.x)**2+(fy[i]-w.y)**2;if(d<bd){bd=d;w.tf={x:fx[i],y:fy[i]}}}drops.forEach(f=>{const d=(f.x-w.x)**2+(f.y-w.y)**2;if(d<bd){bd=d;w.tf=f}})}
    let a=w.tf?Math.atan2(w.tf.y-w.y,w.tf.x-w.x):w.a+Math.sin(fr/40+w.len)*.05;if(w.x<200||w.x>SW-200||w.y<200||w.y>SW-200)a=Math.atan2(SW/2-w.y,SW/2-w.x);
    const px=w.x+Math.cos(w.a)*45,py=w.y+Math.sin(w.a)*45;outer:for(const o of ws){if(o===w||!o.alive)continue;for(let k=0;k<o.segs.length;k+=3)if((o.segs[k].x-px)**2+(o.segs[k].y-py)**2<500){a=w.a+1.2;break outer}}w.ta=a;w.bo=0}
   else{const I=w.id===me.id?{a:ang,b:boost}:(INP[w.id]||{a:w.a,b:0});w.ta=I.a;w.bo=I.b}
   w.a+=Math.max(-.07,Math.min(.07,ad(w.a,w.ta)));const bs=w.bo&&w.len>12,sp=bs?3.6:2;w.boost=bs?1:0;if(bs){w.len-=.03;if(fr%3===0){const t=w.segs[w.segs.length-1];if(t)burst(t.x,t.y,'#ffb703',1)}}
   w.x+=Math.cos(w.a)*sp;w.y+=Math.sin(w.a)*sp;w.segs.unshift({x:w.x,y:w.y});while(w.segs.length>w.len*3)w.segs.pop();
   for(let i=0;i<NF;i++)if((fx[i]-w.x)**2+(fy[i]-w.y)**2<200+w.len){w.len+=.5;if(w.id===me.id)burst(fx[i],fy[i],fcol(i),5);fc[i]++;fpos(i)}
   for(let i=drops.length-1;i>=0;i--){const f=drops[i];if((f.x-w.x)**2+(f.y-w.y)**2<200+w.len){w.len+=.5*f.v;drops.splice(i,1)}}
   if(w.x<0||w.y<0||w.x>SW||w.y>SW)return die(w);
   for(const o of ws){if(o===w||!o.alive)continue;for(let k=6;k<o.segs.length;k+=3)if((o.segs[k].x-w.x)**2+(o.segs[k].y-w.y)**2<110)return die(w)}});
   pt.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.94;p.vy*=.94;p.l-=.035});pt=pt.filter(p=>p.l>0);fr++};
  const pack=()=>JSON.stringify({w:ws.map(w=>{const stp=Math.max(3,Math.ceil(w.segs.length/180)*3),pts=[];for(let k=0;k<w.segs.length;k+=stp)pts.push(Math.round(w.segs[k].x),Math.round(w.segs[k].y));return[w.id,w.name,w.col,w.alive,Math.round(w.x),Math.round(w.y),+w.a.toFixed(2),Math.round(w.len*10)/10,w.boost,...pts]}),fc:fc.map(v=>(v%36).toString(36)).join(''),dr:drops.slice(-80).map(d=>[Math.round(d.x),Math.round(d.y),d.c,d.v])});
  const recv=d=>{lastSnap=Date.now();if(lost){lost=0;if(!myDead)$('#go').hidden=true}const seen={};
   d.w.forEach(a=>{const id=a[0];seen[id]=1;const pts=[];for(let i=9;i<a.length;i+=2)pts.push({x:a[i],y:a[i+1]});let w=gw[id];
    if(!w)w=gw[id]={id,segs:pts.map(p=>({...p})),x:a[4],y:a[5]};
    w.name=a[1];w.col=a[2];w.alive=a[3];w.tx=a[4];w.ty=a[5];w.a=a[6];w.len=a[7];w.boost=a[8];w.tp=pts;while(w.segs.length<pts.length)w.segs.push({...pts[w.segs.length]});if(w.segs.length>pts.length)w.segs.length=pts.length});
   for(const id in gw)if(!seen[id])delete gw[id];
   for(let i=0;i<NF;i++){const v=parseInt(d.fc[i],36);if(v!==fc[i]%36){fc[i]=v;fpos(i)}}
   drops=d.dr.map(a=>({x:a[0],y:a[1],c:a[2],v:a[3]}));ws=Object.values(gw)};
  const draw=()=>{const dw=cv.clientWidth,dh=cv.clientHeight;if(cv.width!==dw||cv.height!==dh){cv.width=dw;cv.height=dh}const w0=meW()||{x:SW/2,y:SW/2,len:12};
   cx.fillStyle='#0b1220';cx.fillRect(0,0,dw,dh);cam.z+=(Math.max(.55,1-w0.len/400)-cam.z)*.05;cam.x+=(w0.x-cam.x)*.15;cam.y+=(w0.y-cam.y)*.15;const z=cam.z,X=cam.x,Y=cam.y,stp=isH?3:1;
   cx.save();cx.translate(dw/2,dh/2);cx.scale(z,z);cx.translate(-X,-Y);
   cx.strokeStyle='#1e2a44';cx.lineWidth=1;cx.beginPath();for(let g=0;g<=SW;g+=100){cx.moveTo(g,0);cx.lineTo(g,SW);cx.moveTo(0,g);cx.lineTo(SW,g)}cx.stroke();cx.strokeStyle='#ff4d6d';cx.lineWidth=8;cx.strokeRect(0,0,SW,SW);
   const dot=(x,y,v,c)=>{if(Math.abs(x-X)<dw/z&&Math.abs(y-Y)<dh/z){const pr=4+v*1.5+Math.sin(lf/8+x)*1;cx.fillStyle=c;cx.globalAlpha=.25;cx.beginPath();cx.arc(x,y,pr*2.2,0,6.28);cx.fill();cx.globalAlpha=1;cx.beginPath();cx.arc(x,y,pr,0,6.28);cx.fill()}};
   for(let i=0;i<NF;i++)dot(fx[i],fy[i],1,fcol(i));drops.forEach(f=>dot(f.x,f.y,f.v,f.c));
   pt.forEach(q=>{cx.globalAlpha=Math.max(0,q.l);cx.fillStyle=q.c;cx.beginPath();cx.arc(q.x,q.y,2+q.l*4,0,6.28);cx.fill()});cx.globalAlpha=1;
   ws.forEach(w=>{if(!w.alive)return;const r=Math.min(16,7+w.len*.05);if(w.id===me.id&&(isH?boost&&w.len>12:w.boost)){cx.globalAlpha=.25;cx.fillStyle='#ffb703';cx.beginPath();cx.arc(w.x,w.y,r*2.4,0,6.28);cx.fill()}
    for(let k=w.segs.length-1;k>=0;k-=stp){const s=w.segs[k],rr=r*(1-k/w.segs.length*.4);cx.globalAlpha=(k/stp|0)%2?1:.85;cx.fillStyle=w.col;cx.beginPath();cx.arc(s.x,s.y,rr,0,6.28);cx.fill();cx.fillStyle='#ffffff33';cx.beginPath();cx.arc(s.x-rr*.25,s.y-rr*.25,rr*.5,0,6.28);cx.fill()}cx.globalAlpha=1;
    [-.6,.6].forEach(o=>{const ex=w.x+Math.cos(w.a+o)*r*.6,ey=w.y+Math.sin(w.a+o)*r*.6;cx.fillStyle='#fff';cx.beginPath();cx.arc(ex,ey,r*.38,0,6.28);cx.fill();cx.fillStyle='#000';cx.beginPath();cx.arc(ex+Math.cos(w.a)*r*.12,ey+Math.sin(w.a)*r*.12,r*.18,0,6.28);cx.fill()});
    cx.fillStyle='#fff';cx.font='bold 12px Nunito,sans-serif';cx.textAlign='center';cx.fillText(w.name+(w.id===me.id?' (kamu)':''),w.x,w.y-r-6)});cx.restore()};
  const loop=t=>{if(sn.off)return;acc+=Math.min(50,t-last);last=t;lf++;

  const pm=e=>{const b=cv.getBoundingClientRect();ang=Math.atan2(e.clientY-b.top-b.height/2,e.clientX-b.left-b.width/2)};

  if(on&&fb){const r2=rm+'-s';

  sn.raf=requestAnimationFrame(loop)}};
