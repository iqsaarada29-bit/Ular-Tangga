<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arena Game by Iqsa</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lilita+One&family=Pacifico&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<meta name="theme-color" content="#1b1450">
<style>
:root{--bg:#fff3d6;--card:#fffdf7;--ink:#2b2118;--mut:#7a6a58;--acc:#ff6b35;--line:#e8d5b0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1612;--card:#2a221b;--ink:#f6ead8;--mut:#b5a48f;--line:#4a3d2e}}
:root[data-theme="dark"]{--bg:#1b1612;--card:#2a221b;--ink:#f6ead8;--mut:#b5a48f;--line:#4a3d2e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,"Segoe UI",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:540px;margin:0 auto;padding:10px}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;margin-top:8px}
h1{margin:0;font-size:28px;text-align:center}h2{margin:0 0 6px}h3{margin:18px 0 8px;font-size:16px}
.mut{color:var(--mut);font-size:14px}label{font-size:13px;color:var(--mut);display:block;margin:12px 0 4px}
input{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:11px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px}.row>*{flex:1}.sw{display:flex;gap:7px;flex-wrap:wrap}
.btn{background:var(--acc);color:#fff;border:0;border-radius:14px;padding:11px 14px;font:inherit;font-weight:700;font-size:16px;min-height:46px;cursor:pointer}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}.btn.alt.on{border-color:var(--acc)}
.btn:disabled{opacity:.5}.btn:active{transform:scale(.97)}
.sq{width:38px;height:38px;border-radius:50%;border:3px solid var(--line);font-size:20px;padding:0;background:var(--card);cursor:pointer}
.sq.sel{border-color:var(--ink);transform:scale(1.18)}
.th{border:3px solid var(--line);border-radius:12px;padding:8px 10px;font:inherit;font-weight:700;color:#2b2118;cursor:pointer}.th.sel{border-color:var(--ink);transform:scale(1.06)}
.code{font-size:34px;letter-spacing:6px;font-weight:800;color:var(--acc)}
.slot{padding:11px 12px;border:2px dashed var(--line);border-radius:12px;margin:6px 0;font-weight:600}
.top{display:flex;align-items:center;gap:6px;justify-content:space-between}.top b{font-size:17px}.top button{padding:6px 10px;min-height:0;font-size:14px}
#chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{flex:1;min-width:46%;border:3px solid;border-radius:12px;padding:6px 8px;background:var(--card);font-size:14px;font-weight:700;display:flex;justify-content:space-between;gap:6px;transition:.3s}
.chip.cur{transform:scale(1.04);box-shadow:0 0 0 3px #ffd60a99}.chip small{color:var(--mut);font-weight:700}
#bw{position:relative;margin-bottom:11%}
#bd{display:grid;grid-template-columns:repeat(10,1fr);aspect-ratio:1;border-radius:14px;overflow:hidden;border:5px solid;box-shadow:0 6px 18px #0003}
.cell{position:relative;cursor:pointer;box-shadow:inset 0 0 0 .5px #ffffff88}.cell:active{filter:brightness(1.15)}
.cell .n{position:absolute;top:2px;left:3px;font-size:clamp(7px,2.2vw,11px);color:#3a2a1a;font-weight:800;opacity:.75}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tok{position:absolute;width:6.8%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:clamp(11px,4vw,20px);transform:translate(-50%,-50%);transition:left .35s ease,top .35s ease,transform .4s;border:3px solid #fff;box-shadow:0 2px 6px #0007;z-index:5}
#toks.slow .tok{transition-duration:.9s}#toks.nt .tok{transition:left .08s linear,top .08s linear}
.tok.cur{animation:hop .7s infinite}.tok.climb{animation:climb .3s infinite;z-index:8}
.tok.gulp{transform:translate(-50%,-50%) scale(0) rotate(240deg)}.tok.slither{animation:slit .3s infinite;opacity:.85;z-index:8}.tok.shake{animation:shk .12s 5}
@keyframes hop{50%{margin-top:-5px}}@keyframes climb{0%,100%{transform:translate(-50%,-50%) rotate(-14deg) scale(1.2)}50%{transform:translate(-50%,-62%) rotate(14deg) scale(1.2)}}
@keyframes slit{0%,100%{transform:translate(-50%,-50%) scale(.7) skewX(-18deg)}50%{transform:translate(-50%,-50%) scale(.7) skewX(18deg)}}
@keyframes shk{0%,100%{margin-left:0;filter:none}50%{margin-left:7px;filter:hue-rotate(300deg)}}
.fx{position:absolute;transform:translate(-50%,-50%);font-size:clamp(28px,10vw,54px);z-index:9;pointer-events:none;animation:fxp 1.3s ease-out forwards}
@keyframes fxp{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}25%{opacity:1;transform:translate(-50%,-70%) scale(1.3)}100%{opacity:0;transform:translate(-50%,-140%) scale(1)}}
#start{position:absolute;left:0;right:0;bottom:-10.5%;font-size:12px;color:var(--mut);font-weight:800;letter-spacing:2px;padding-left:2%}
#panel{display:flex;align-items:center;gap:14px;margin-top:6px}
#dice{font-size:68px;line-height:1;width:84px;text-align:center}#dice.spin{animation:sp .25s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#rollb{flex:1;font-size:19px;min-height:60px}
#msg{text-align:center;min-height:44px;margin-top:8px;font-weight:700}
#ovl{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:20;padding:20px}
#ovl[hidden]{display:none}#ovl .card{text-align:center;max-width:340px}#ovl .big{font-size:64px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;z-index:30;font-size:14px}

body{font-family:"Nunito",ui-rounded,system-ui,sans-serif;background:var(--bg) radial-gradient(900px 420px at 50% -8%,#ff9f4333,transparent) no-repeat fixed}
h1,h2,h3,.btn,.code,.chip,.gcard b,.word{font-family:"Fredoka","Nunito",ui-rounded,sans-serif}
.card{box-shadow:0 8px 24px #0002;border-radius:22px}
.btn{background:linear-gradient(180deg,#ff8a4c,#ff6b35);box-shadow:0 3px 0 #c8501f;letter-spacing:.2px}.btn.alt{background:var(--card);box-shadow:none}
#gl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.gcard{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 8px;border:3px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;transition:.15s}
.gcard:active{transform:scale(.96)}.gcard .gi{font-size:38px}.gcard b{font-size:18px}.gcard small{color:var(--mut);font-size:11px;text-align:center}
#tg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.tc{aspect-ratio:1;font-size:min(16vw,80px);border-radius:16px;border:3px solid var(--line);background:var(--card);cursor:pointer;padding:0}
.uc{width:54px;height:80px;border-radius:12px;border:3px solid #fff;color:#fff;font:800 22px "Fredoka",sans-serif;box-shadow:0 3px 8px #0004;flex:none;display:grid;place-items:center;cursor:pointer;padding:0}
.uc.wd{background:conic-gradient(#e63946 0 25%,#f4b400 0 50%,#2ea44f 0 75%,#2f6fe4 0)}.uc.dim{opacity:.4}.uc.back{background:#222;font-size:14px}
.uc.big{width:84px;height:122px;font-size:34px;cursor:default}.piles{display:flex;gap:20px;justify-content:center;margin:14px 0;align-items:center}
#hand{display:flex;gap:6px;overflow-x:auto;padding:10px 4px}
#lb{position:relative;aspect-ratio:1;width:100%;max-width:520px;margin:8px auto;border-radius:14px;overflow:hidden;box-shadow:0 6px 18px #0003}
#lb svg{width:100%;height:100%;display:block}
.lt{position:absolute;width:5.2%;aspect-ratio:1;border-radius:50%;border:2.5px solid #fff;transform:translate(-50%,-50%);transition:left .4s,top .4s;box-shadow:0 2px 4px #0006;z-index:3}
.lt.mv{animation:pls .6s infinite;cursor:pointer;z-index:4}@keyframes pls{50%{transform:translate(-50%,-50%) scale(1.15)}}
.word{font-size:30px;font-weight:800;padding:14px;border-radius:16px;background:var(--bg);border:3px dashed var(--acc);margin:8px 0}
.chip.dead{opacity:.4;text-decoration:line-through}
#sw{position:relative}#cv{width:100%;height:68vh;border-radius:16px;touch-action:none;display:block;background:#0b1220}
#bst{position:absolute;right:14px;bottom:14px;width:72px;height:72px;border-radius:50%;border:0;font-size:30px;background:#ffb703;box-shadow:0 4px 0 #c98600;touch-action:none}
#lb2{position:absolute;left:10px;top:8px;color:#fff;font-size:12px;font-weight:800;text-shadow:0 1px 2px #000;pointer-events:none}
#go{position:absolute;inset:0;display:grid;place-items:center;background:#000a;border-radius:16px;padding:16px}#go[hidden]{display:none}#go .card{text-align:center}

.rise{animation:rise .45s cubic-bezier(.2,.9,.3,1.1)}@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
@keyframes popin{from{transform:scale(0) rotate(-90deg);opacity:0}to{transform:none;opacity:1}}
@keyframes flipin{from{transform:perspective(500px) rotateX(90deg);opacity:0}to{transform:none;opacity:1}}
@keyframes bob{50%{transform:translateY(-6px)}}@keyframes glowp{50%{box-shadow:0 0 0 6px #ffd60a66}}
@keyframes slidein{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
#toast{animation:slidein .25s}
.gcard{animation:popin .5s cubic-bezier(.3,1.5,.5,1) backwards}
.gcard:nth-child(2){animation-delay:.06s}.gcard:nth-child(3){animation-delay:.12s}.gcard:nth-child(4){animation-delay:.18s}.gcard:nth-child(5){animation-delay:.24s}.gcard:nth-child(6){animation-delay:.3s}
.gcard .gi{display:inline-block;animation:bob 2.6s ease-in-out infinite}.gcard:nth-child(even) .gi{animation-delay:-1.3s}
.gcard:hover{transform:translateY(-4px);border-color:var(--acc)}.gcard:hover .gi{transform:rotate(-12deg) scale(1.2)}
#app h1{animation:bob 3s ease-in-out infinite}
.btn{transition:transform .12s,filter .12s}.btn:hover{filter:brightness(1.07)}
.chip.cur{animation:glowp 1.4s infinite}
#ovl .card{animation:popin .45s cubic-bezier(.3,1.5,.5,1)}
.cf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}
.cf i{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;animation:cfall linear forwards}
@keyframes cfall{to{transform:translateY(112vh) rotate(720deg)}}
.tc{transition:transform .15s,background .2s}.tc:hover{transform:scale(1.05)}
.tc.pop{animation:popin .35s cubic-bezier(.3,1.6,.5,1)}
.tc.win{animation:winp .7s infinite;background:linear-gradient(135deg,#ffe29a,#ffa99f)}@keyframes winp{50%{transform:scale(1.1)}}
.uc{transition:transform .15s,box-shadow .15s}.uc.pl{animation:glowp 1.3s infinite}.uc:not(.dim):not(.big):hover{transform:translateY(-12px) scale(1.06)}
.uc.drop{animation:drop .5s cubic-bezier(.3,1.4,.5,1)}@keyframes drop{from{transform:translateY(-140px) rotate(-30deg) scale(1.5);opacity:0}to{transform:none;opacity:1}}
.uc.deal{animation:dealin .5s cubic-bezier(.3,1.3,.5,1) backwards}@keyframes dealin{from{transform:translate(120px,-160px) rotate(60deg) scale(.5);opacity:0}to{transform:none;opacity:1}}
.uc.nw{animation:nwc .6s cubic-bezier(.3,1.5,.5,1)}@keyframes nwc{from{transform:translateY(-90px) scale(.4) rotateY(180deg);opacity:0}to{transform:none;opacity:1}}
.uc.back.go{animation:bob .9s infinite}
#dice.roll{animation:droll .6s}@keyframes droll{0%{transform:rotate(0) scale(.6)}60%{transform:rotate(540deg) scale(1.3)}100%{transform:rotate(720deg) scale(1)}}
.lt.hop{animation:hopl .23s}@keyframes hopl{50%{margin-top:-14px}}
.lt.zap{animation:zap .3s}@keyframes zap{50%{transform:translate(-50%,-50%) scale(1.9);opacity:.2}}
.word.flip{animation:flipin .5s}.bounce{display:inline-block;animation:bob 1s infinite}
#go .card{animation:popin .5s cubic-bezier(.3,1.5,.5,1)}

body[data-g="uno"]{--bg:#14532d;--card:#fffdf7;--ink:#2b2118;--mut:#6b5b4b;--line:#e8d5b0;background:radial-gradient(ellipse at 50% 15%,#34a06a,#14532d 75%) fixed}
body[data-g="ludo"]{--bg:#ffe9c2;--card:#fffdf7;--ink:#2b2118;--mut:#7a6a58;--line:#e8d5b0;background:linear-gradient(160deg,#fff3dc,#ffd59a) fixed}
body[data-g="ttt"]{--bg:#1e3a8a;--card:#f8fbff;--ink:#12285c;--mut:#5a6b94;--line:#c6d4f5;background:linear-gradient(160deg,#2c5fd8,#14306e) fixed}
body[data-g="uc"]{--bg:#150d29;--card:#2a1b4d;--ink:#f3eaff;--mut:#b7a6d9;--line:#4b3585;background:radial-gradient(ellipse at 50% 0,#4b2a8a,#150d29 70%) fixed}
body[data-g="snake"]{--bg:#0b1220;--card:#16223a;--ink:#eaf2ff;--mut:#9db0d3;--line:#273a5f;background:radial-gradient(ellipse at 50% 0,#1a2d54,#0b1220 75%) fixed}
body[data-g="uno"] .top b,body[data-g="uno"] #msg,body[data-g="ttt"] .top b,body[data-g="ttt"] #msg{color:#fff}
body[data-g="uno"] #msg small{color:#d9f3e4}
.uc{position:relative;width:58px;height:86px;border-radius:10px;border:3px solid #fff;background:var(--c,#111);overflow:hidden;box-shadow:0 4px 10px #0005;display:block;padding:0;flex:none;cursor:pointer;color:#fff}
.uc .e{position:absolute;left:-8%;right:-8%;top:15%;bottom:15%;background:#fff;border-radius:50%;transform:rotate(-26deg)}
.uc .m{position:absolute;inset:0;display:grid;place-items:center;font:900 28px "Fredoka",sans-serif;color:var(--c);text-shadow:1px 2px 0 #0002;z-index:1}
.uc small{position:absolute;font:800 11px "Fredoka",sans-serif;z-index:2;color:#fff;text-shadow:0 1px 1px #0006}.uc .tl{top:3px;left:5px}.uc .br{bottom:3px;right:5px;transform:rotate(180deg)}
.uc.wd{background:#111}.uc.wd .e{background:conic-gradient(#e63946 0 25%,#f4b400 0 50%,#2ea44f 0 75%,#2f6fe4 0)}.uc.wd .m{color:#fff;text-shadow:0 2px 3px #000}
.uc.back{background:#111;box-shadow:3px 3px 0 #333,6px 6px 0 #222,0 8px 14px #0007}.uc.back .e{background:#e63946}.uc.back .m{color:#ffde59;font-size:17px;transform:rotate(-26deg);text-shadow:1px 1px 0 #000}
.uc.big{width:92px;height:136px;border-radius:14px;cursor:default}.uc.big .m{font-size:52px}.uc.big small{font-size:16px}
.uc.nw{animation:none}.ring{padding:7px;border-radius:22px;box-shadow:0 0 0 4px var(--rc),0 0 28px var(--rc);transition:.4s}
#hand{padding:20px 10px 8px;gap:0}#hand .uc{margin-left:-16px}#hand .uc:first-child{margin-left:0}#hand .uc:not(.dim):hover{z-index:5}
.lt{background:none!important;border:0!important;border-radius:0!important;box-shadow:none!important;width:6%!important;aspect-ratio:24/32!important;transform:translate(-50%,-74%)!important;filter:drop-shadow(0 2px 2px #0007)}
.lt svg{width:100%;height:100%;display:block}
.lt.mv{animation:pls2 .7s infinite!important}@keyframes pls2{50%{transform:translate(-50%,-50%) scale(1.18)}}
.lt.zap{animation:zap2 .3s!important}@keyframes zap2{50%{transform:translate(-50%,-74%) scale(1.8);opacity:.2}}
.avs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.av{background:var(--card);border:3px solid var(--c);border-radius:16px;padding:8px 2px;text-align:center;font-size:12px;font-weight:800;position:relative;transition:.3s;overflow:hidden;text-overflow:ellipsis}
.av .ae{display:block;font-size:30px}.av.spk{animation:glowp 1s infinite;transform:scale(1.07)}.av.me:after{content:'⭐';position:absolute;top:-2px;right:2px}
.av.dead{opacity:.45;filter:grayscale(1)}.av small{display:block;color:var(--mut);font-size:10px}
.step{font:800 15px "Fredoka",sans-serif;letter-spacing:.5px;color:var(--acc);margin-bottom:6px}
.tbar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0}.tbar i{display:block;height:100%;background:linear-gradient(90deg,#2ea44f,#f4b400,#e63946);animation:tbar linear forwards}@keyframes tbar{from{width:100%}to{width:0}}
.flipc{display:block;width:100%;perspective:600px;background:none;border:0;padding:0;cursor:pointer;margin:8px 0}
.flipc .ff{position:relative;height:84px;transition:transform .6s;transform-style:preserve-3d}.flipc.on .ff{transform:rotateY(180deg)}
.flipc .fr,.flipc .bk{position:absolute;inset:0;display:grid;place-items:center;border-radius:16px;backface-visibility:hidden;font:800 26px "Fredoka",sans-serif}
.flipc .fr{background:linear-gradient(135deg,#7b2cbf,#4361ee);color:#fff;font-size:16px}.flipc .bk{background:var(--bg);border:3px dashed var(--acc);transform:rotateY(180deg);color:var(--ink)}
.vb{display:flex;align-items:center;gap:10px;width:100%;margin:5px 0;padding:10px 14px;border-radius:14px;border:3px solid var(--line);background:var(--bg);color:var(--ink);font:800 16px "Fredoka",sans-serif;cursor:pointer;transition:.15s}
.vb:active{transform:scale(.97)}.vb:hover{border-color:var(--acc)}.vb .ae{font-size:26px}

/* ---- UNO table layout ---- */
.ut{display:grid;grid-template-columns:76px 1fr 76px;grid-template-rows:auto 1fr;gap:4px;margin-top:8px;min-height:340px}
.ut .s-t{grid-column:1/4;grid-row:1;justify-self:center}
.ut .s-l{grid-column:1;grid-row:2;align-self:center}
.ut .s-r{grid-column:3;grid-row:2;align-self:center}
.ut .ctr{grid-column:2;grid-row:2;display:flex;align-items:center;justify-content:center;gap:14px;position:relative}
.ut .ctr .uc.back{width:62px;height:92px}.ut .ctr .uc.big{width:80px;height:118px}
.dirm{position:absolute;top:2px;left:50%;transform:translateX(-50%);font-size:26px;color:#fff9;pointer-events:none}
.seat{display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.pav{position:relative;width:54px;height:54px;border-radius:50%;border:3px solid var(--c);background:#fff;display:grid;place-items:center;font-size:30px;box-shadow:0 3px 8px #0006;transition:.3s}
.seat.cur .pav{animation:glowp 1s infinite;transform:scale(1.1);border-color:#ffd60a}
.pav .cn{position:absolute;right:-9px;bottom:-6px;min-width:22px;height:22px;padding:0 3px;box-sizing:border-box;border-radius:11px;background:#e63946;color:#fff;font:800 13px "Fredoka",sans-serif;display:grid;place-items:center;border:2px solid #fff}
.pnm{background:#2f6fe4;color:#fff;border-radius:10px;padding:1px 10px;font:800 12px "Fredoka",sans-serif;border:2px solid #fff9;max-width:78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:.3s}
.seat.cur .pnm{background:#f4b400;color:#2b2118}
.unob{font:800 11px "Fredoka",sans-serif;background:#e63946;color:#fff;border-radius:8px;padding:0 7px;border:2px solid #fff;animation:bob .8s infinite}
.fan{position:relative;width:110px;height:50px;margin-top:4px}
.s-l .fan,.s-r .fan{width:50px;height:110px}
.fan .fi{position:absolute;left:50%;top:50%;width:110px;height:44px;margin:-22px 0 0 -55px}
.s-t .fi{transform:rotate(180deg)}.s-l .fi{transform:rotate(90deg)}.s-r .fi{transform:rotate(-90deg)}
.ob{position:absolute;left:50%;top:0;width:26px;height:40px;margin-left:-13px;border-radius:5px;border:2px solid #fff;box-sizing:border-box;background:radial-gradient(ellipse at 50% 50%,#e63946 0 34%,#111 37%);box-shadow:0 2px 4px #0006;transform-origin:50% 220%}
.seat.shake{animation:shk .4s 2}@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.mebar{display:flex;align-items:center;gap:10px;margin-top:4px;padding-left:6px}
.mebar .seat{flex-direction:row;gap:10px}.mebar .pnm{max-width:120px}
#stk{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:#0006;color:#fff;border-radius:14px;padding:8px 10px;margin-top:6px;font-weight:700;font-size:13px}
#stk span{flex:1 1 100%}#stk .btn{flex:1;min-height:38px;font-size:15px;padding:6px 10px}
#hand{justify-content:safe center;padding-top:26px}
#hand .uc{transition:transform .15s,opacity .15s}
#hand .uc.sel{transform:translateY(-24px) scale(1.06)!important;z-index:6;box-shadow:0 0 0 3px #ffd60a,0 8px 14px #0007}
#hand .uc.cand{animation:glowp 1s infinite}
